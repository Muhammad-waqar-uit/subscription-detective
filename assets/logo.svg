<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Subscription Detective">
  <title>Subscription Detective</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e343f"/>
      <stop offset="1" stop-color="#1e232b"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- magnifying glass handle -->
  <line x1="82" y1="82" x2="104" y2="104" stroke="#979fae" stroke-width="13" stroke-linecap="round"/>
  <!-- lens -->
  <circle cx="56" cy="56" r="32" fill="none" stroke="#f7f8fa" stroke-width="9"/>
  <circle cx="56" cy="56" r="32" fill="#f7f8fa" fill-opacity="0.06"/>
  <!-- recurring arrow inside lens -->
  <path d="M43 56 A13 13 0 0 1 66 47" fill="none" stroke="#7d5f33" stroke-width="6" stroke-linecap="round"/>
  <path d="M69 56 A13 13 0 0 1 46 65" fill="none" stroke="#f7f8fa" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 41 L72 46 L63 55 Z" fill="#7d5f33"/>
  <path d="M52 71 L40 66 L49 57 Z" fill="#f7f8fa"/>
  <g clip-path="url(#round)"/>
</svg>